<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ nickname }} - Portofolio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/css/style.css">
        <link rel="icon" href="/static/img/favicon.ico">
        <script src="https://kit.fontawesome.com/65d7500d12.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <header class="site-header">
            <div class="container">
                <a href="{% url 'main:show_main' %}" class="brand">{{ nickname }}</a>
                <nav>
                    <a href="{% url 'main:show_main' %}">Profile</a>
                    <a href="{% url 'main:show_education' %}">Education</a>
                    <a href="{% url 'main:show_experience' %}">Experience</a>
                </nav>
            </div>
        </header>

        <main>
            <section class="hero" id="profile">
                <div class="container hero-grid">
                    <div class="hero-identity">
                        <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                        <h1>{{ full_name }}</h1>
                    </div>
                    <div class="hero-photo">
                        <div class="photo-block"></div>
                        <img class="avatar" src="/static/img/MyPhoto.jpeg" alt="Photo of {{ name }}">
                    </div>
                    <div class="hero-details">
                        <p class="bio"> {{ bio }}</p>
                        <dl class="meta-list">
                            <div class="meta-row">
                                <dt>NPM</dt>
                                <dd>{{ npm }}</dd>
                            </div>
                            <div class="meta-row">
                                <dt>Program</dt>
                                <dd>{{ study_program }}</dd>
                            </div>
                        </dl>
                        <div class="social-links">
                            <a href ="https://github.com/ridhoanwar24" target="_blank" aria-label="Github" style="color: #000000">
                                <i class="fa-brands fa-github fa-2x logo-social"></i>
                            </a>
                            <a href="https://www.linkedin.com/in/muhammad-ridho-anwar-4a2850205/" target="_blank" aria-label="Linkedin" style="color: #000000">
                                <i class="fa-brands fa-linkedin fa-2x logo-social"></i>
                            </a>
                            <a href="mailto:muhammad.ridho52@ui.ac.id" target="_blank" aria-label="Email" style="color: #000000">
                                <i class="fa-solid fa-envelope fa-2x logo-social"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <div class="container">
                <p>&copy; 2026 {{ nickname }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
            </div>
        </footer>
    </body>
</html>
