{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/css/style.css">
        <link rel="icon" href="/static/img/favicon.ico">
        <script src="https://kit.fontawesome.com/65d7500d12.js" crossorigin="anonymous"></script>
        {% block meta %} {% endblock meta %}
    </head>

    <body>
        <header class="site-header">
            <div class="container">
                <a href="{% url 'main:show_main' %}" class="brand">{{ nickname }}</a>
                <nav>
                    <a href="{% url 'main:show_main' %}">Profile</a>
                    <a href="{% url 'main:show_education' %}">Education</a>
                    <a href="{% url 'main:show_experience' %}">Experience</a>
                </nav>
            </div>
        </header>
        {% block content %} {% endblock content %}

        <footer class="site-footer">
            <div class="container">
                <p>&copy; 2026 {{ nickname }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
            </div>
        </footer>
    </body>
</html>
